<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow">Account recovery</div>
    <h1>Set a new password</h1>
    <p class="form-note">
      Enter your account email and choose a new password. This frontend demo
      updates the password directly in Local Storage without email verification.
    </p>
    <form id="reset-form">
      <div class="form-group">
        <label for="reset-email">College email</label
        ><input
          id="reset-email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="form-group">
        <label for="new-password">New password</label
        ><input
          id="new-password"
          name="password"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm new password</label
        ><input
          id="confirm-password"
          name="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>
      <div id="reset-error" class="form-error" role="alert"></div>
      <button class="btn btn-primary" style="width: 100%" type="submit">
        Save new password
      </button>
    </form>
    <div class="auth-switch">
      Remembered it? <button data-route="login">Back to log in</button>
    </div>
  </section>
</main>
