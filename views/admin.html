<section class="welcome">
  <h2>Admin control panel</h2>
  <p>
    Create relevant courses and keep track of the college learning community.
  </p>
</section>
<section class="dashboard-stats">
  <div class="dashboard-stat">
    <span>Total courses</span><strong data-total-courses>0</strong>
  </div>
  <div class="dashboard-stat">
    <span>Registered students</span><strong data-student-count>0</strong>
  </div>
  <div class="dashboard-stat">
    <span>System status</span
    ><strong style="color: var(--green); font-size: 1.25rem">Active</strong>
  </div>
</section>
<div class="section-title">
  <h2>Course catalogue</h2>
  <button class="btn btn-primary" data-modal>Add new course +</button>
</div>
<section class="course-grid" data-admin-course-list></section>
<div class="section-title">
  <h2>Course assignments</h2>
  <button class="btn btn-primary" data-add-assignment>Add assignment +</button>
</div>
<section class="assignment-list" data-admin-assignment-list></section>
