<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow" data-auth-eyebrow>Join the classroom</div>
    <h1 data-auth-title>Create an account</h1>
    <p class="form-note" data-auth-description>
      Start learning with your college community today.
    </p>
    <form id="auth-form">
      <div class="form-group" data-name-group>
        <label for="name">Full name</label
        ><input id="name" name="name" placeholder="e.g. Aarav Patel" required />
      </div>
      <div class="form-group">
        <label for="email">College email</label
        ><input
          id="email"
          name="email"
          type="email"
          placeholder="you@college.edu"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label
        ><input
          id="password"
          name="password"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        />
      </div>
      <div id="auth-error" class="form-error" role="alert"></div>
      <button
        class="btn btn-primary"
        style="width: 100%"
        type="submit"
        data-auth-submit
      >
        Sign up
      </button>
    </form>
    <p class="auth-switch" data-login-help>
      <button data-route="forgot-password">Forgot password?</button>
    </p>
    <p class="form-note" data-admin-demo style="margin-top: 16px">
      <strong>Demo admin:</strong> admin@college.edu / admin123
    </p>
    <div class="auth-switch">
      <span data-auth-switch-label>Already have an account?</span>
      <button data-route="login" data-auth-switch-button>Log in</button>
    </div>
  </section>
</main>
